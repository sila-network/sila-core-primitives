# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# An explicit "bash" makes Actions run "bash --noprofile --norc -eo pipefail",
# so a failing command piped into grep still fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        go: ["1.23.x", "1.25.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Report CPU and selected kernel
        run: |
          go version
          uname -m
          grep -m1 'model name' /proc/cpuinfo || true
          grep -o -w -E 'avx512f|avx512vl' /proc/cpuinfo | sort -u || echo "no AVX-512 flags"
          # Do not turn a failed kernel diagnostic into a green CI step.
          go test -count=1 -run 'TestAVX512Kernels' -v ./keccak | grep -E 'SKIP|PASS|FAIL|ok'

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags purego ./...

      - name: Tests (default kernels)
        run: go test -count=1 -cover ./...

      - name: Consumer API integration (published tag + current SILA source)
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cd "$consumer"
          go mod init sila-keccak-consumer
          # Verify a fresh external consumer can download the actual published tag.
          go get github.com/sila-network/sila-core-primitives@v1.1.0
          cat > main.go <<'GO'
          package main

          import (
              "encoding/hex"
              "fmt"

              "github.com/sila-network/sila-core-primitives/keccak"
          )

          func main() {
              got := keccak.Sum256(nil)
              if hex.EncodeToString(got[:]) != "c5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470" {
                  panic("Keccak-256 empty-input known-answer mismatch")
              }
              h := keccak.New()
              if _, err := h.Write([]byte("a")); err != nil {
                  panic(err)
              }
              if _, err := h.Write([]byte("bc")); err != nil {
                  panic(err)
              }
              want := keccak.Sum256([]byte("abc"))
              if hex.EncodeToString(h.Sum(nil)) != hex.EncodeToString(want[:]) {
                  panic("SILA incremental hashing differs from one-shot")
              }
              fmt.Println("SILA Keccak-256 consumer API: PASS")
          }
          GO
          go run .  # publicly published v1.1.0
          # Then prove the current proposed source has the same consumer API.
          go mod edit -replace=github.com/sila-network/sila-core-primitives="$GITHUB_WORKSPACE"
          go run .  # current repository head

      - name: Tests (portable kernel, -tags purego)
        run: go test -count=1 -cover -tags purego ./...

      - name: Race detector
        run: |
          go test -count=1 -race ./...
          go test -count=1 -race -tags purego ./...

      - name: Generated kernels are up to date
        run: |
          (cd keccak && go generate)
          git diff --exit-code -- keccak/

      - name: Short fuzz
        run: go test -run '^$' -fuzz FuzzSum256 -fuzztime 30s ./keccak

  cross-arch:
    name: Other architectures (386 native; s390x big-endian, ppc64le, riscv64 under QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install QEMU user-mode emulators
        # "qemu-user" exists on Ubuntu 24.04 and 26.04; "qemu-user-static" is a
        # virtual package without an installation candidate on 26.04.
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user
      - name: 386 (native)
        run: GOARCH=386 go test -count=1 -short ./...
      - name: s390x, ppc64le, riscv64 (emulated; correctness only, no timing)
        run: |
          for arch in s390x ppc64le riscv64; do
            echo "== $arch"
            GOARCH=$arch go vet ./...
            GOARCH=$arch go test -c -o "$RUNNER_TEMP/keccak.$arch" ./keccak
            emu=$(command -v "qemu-$arch" || command -v "qemu-$arch-static")
            (cd keccak && "$emu" "$RUNNER_TEMP/keccak.$arch" -test.short -test.count=1 -test.v | grep -E '^(--- |PASS|FAIL|ok)')
          done
      - name: loong64 (build and vet only; no emulator on the runner image)
        run: GOARCH=loong64 go vet ./... && GOARCH=loong64 go test -c -o /dev/null ./keccak

  independent-verification:
    name: Independent oracle (907 cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install oracle
        run: python -m pip install pycryptodome==4.4.0
      - name: Build binaries
        run: |
          go build -o "$RUNNER_TEMP/sila-keccak256" ./cmd/sila-keccak256
          go build -tags purego -o "$RUNNER_TEMP/sila-keccak256-purego" ./cmd/sila-keccak256
      - name: Verify default build
        run: python -I scripts/verify_independent.py "$RUNNER_TEMP/sila-keccak256"
      - name: Verify portable build
        run: python -I scripts/verify_independent.py "$RUNNER_TEMP/sila-keccak256-purego"

  geth-equivalence:
    name: Equivalence with go-ethereum v1.17.10
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: benchmarks/geth-compare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: go vet
        run: go vet .
      - name: Same output as go-ethereum (all kernels)
        run: |
          go test -count=1 -run 'TestSameOutput|TestRandomAgainstGeth|TestDispatchReport' -v . | grep -E 'enabled|^(ok|FAIL|---)'
          go test -count=1 -run 'TestSameOutput|TestRandomAgainstGeth' . -args -sila.noavx512
          go test -count=1 -tags purego -run 'TestSameOutput|TestRandomAgainstGeth' .
      # Performance is measured on dedicated hardware with run.sh, not on
      # shared CI runners whose timings are not comparable.
