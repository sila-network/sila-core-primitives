# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# An explicit "bash" makes Actions run "bash --noprofile --norc -eo pipefail",
# so a failing command piped into grep still fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        go: ["1.23.x", "1.25.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Report CPU and selected kernel
        run: |
          go version
          uname -m
          grep -m1 'model name' /proc/cpuinfo || true
          grep -o -w -E 'avx512f|avx512vl' /proc/cpuinfo | sort -u || echo "no AVX-512 flags"
          go test -count=1 -run 'TestAVX512Kernels' -v ./keccak | grep -E 'SKIP|PASS|FAIL|ok' || true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags purego ./...

      - name: Tests (default kernels)
        run: go test -count=1 -cover ./...

      - name: Tests (portable kernel, -tags purego)
        run: go test -count=1 -cover -tags purego ./...

      - name: Race detector
        run: |
          go test -count=1 -race ./...
          go test -count=1 -race -tags purego ./...

      - name: secp256k1 compiled-code constant-time check (no conditional branches in constant-time functions)
        run: SILA_CT_OBJDUMP=1 go test -count=1 -run 'TestCompiled' -v ./secp256k1 | grep -E '^(---|ok|FAIL)|branch'

      - name: Generated kernels are up to date
        run: |
          (cd keccak && go generate)
          git diff --exit-code -- keccak/

      - name: Short fuzz
        run: go test -run '^$' -fuzz FuzzSum256 -fuzztime 30s ./keccak

      - name: Short fuzz (secp256k1)
        run: |
          for f in FuzzPublicKeyRoundTrip FuzzParseAndVerifySignature FuzzSignVerifyRecover; do
            go test -run '^$' -fuzz "^${f}\$" -fuzztime 15s ./secp256k1
          done
          go test -run '^$' -fuzz '^FuzzParseCompactYParity$' -fuzztime 15s ./txsig

  cross-arch:
    name: Other architectures (386 native; s390x big-endian, ppc64le, riscv64 under QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install QEMU user-mode emulators
        # "qemu-user" exists on Ubuntu 24.04 and 26.04; "qemu-user-static" is a
        # virtual package without an installation candidate on 26.04.
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user
      - name: 386 (native)
        run: GOARCH=386 go test -count=1 -short ./...
      - name: s390x, ppc64le, riscv64 (emulated; correctness only, no timing)
        run: |
          for arch in s390x ppc64le riscv64; do
            echo "== $arch"
            GOARCH=$arch go vet ./...
            emu=$(command -v "qemu-$arch" || command -v "qemu-$arch-static")
            for pkg in keccak secp256k1 txsig account; do
              GOARCH=$arch go test -c -o "$RUNNER_TEMP/$pkg.$arch" "./$pkg"
              (cd "$pkg" && "$emu" "$RUNNER_TEMP/$pkg.$arch" -test.short -test.count=1 -test.v | grep -E '^(--- |PASS|FAIL|ok)')
            done
          done
      - name: secp256k1 compiled-code constant-time check (386, ppc64le, riscv64 machine code)
        run: |
          for arch in 386 ppc64le riscv64; do
            echo "== $arch"
            SILA_CT_OBJDUMP=1 SILA_CT_GOARCH=$arch go test -count=1 -run 'TestCompiled' -v ./secp256k1 | grep -E '^(---|ok|FAIL)|branch'
          done
      - name: loong64 (build and vet only; no emulator on the runner image)
        run: GOARCH=loong64 go vet ./... && GOARCH=loong64 go test -c -o /dev/null ./keccak && GOARCH=loong64 go test -c -o /dev/null ./secp256k1 && GOARCH=loong64 go test -c -o /dev/null ./txsig

  independence:
    name: SILA independence (dependency graph, offline build, binary metadata, naming)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Check independence
        run: ./scripts/check_independence.sh

  timing:
    name: secp256k1 timing evidence (informational) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Shared runners are noisy: this job records |t| values (dudect-style
    # Welch test with a random-vs-random control) on real amd64 and arm64
    # hardware, but cannot fail the workflow.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Welch t-test, tiny vs random secrets with random-vs-random controls (100k samples, 5 runs, pinned core)
        run: |
          uname -m
          SILA_TIMING_TEST=1 SILA_TIMING_SAMPLES=100000 SILA_TIMING_REPS=5 taskset -c 0 go test -count=1 -timeout 60m -run ConstantTimeStatistical -v ./secp256k1 | grep -E 'timing_test|^(---|ok|FAIL)'

  independent-verification:
    name: Independent oracle (907 cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install oracle
        run: python -m pip install pycryptodome==4.4.0
      - name: Build binaries
        run: |
          go build -o "$RUNNER_TEMP/sila-keccak256" ./cmd/sila-keccak256
          go build -tags purego -o "$RUNNER_TEMP/sila-keccak256-purego" ./cmd/sila-keccak256
      - name: Verify default build
        run: python -I scripts/verify_independent.py "$RUNNER_TEMP/sila-keccak256"
      - name: Verify portable build
        run: python -I scripts/verify_independent.py "$RUNNER_TEMP/sila-keccak256-purego"

  geth-equivalence:
    name: Equivalence with go-ethereum v1.17.10 (Keccak; secp256k1 vs libsecp256k1 and decred)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: benchmarks/geth-compare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: go vet
        run: go vet .
      - name: Same output as go-ethereum (all kernels)
        run: |
          go test -count=1 -run 'TestSameOutput|TestRandomAgainstGeth|TestDispatchReport' -v . | grep -E 'enabled|^(ok|FAIL|---)'
          go test -count=1 -run 'TestSameOutput|TestRandomAgainstGeth' . -args -sila.noavx512
          go test -count=1 -tags purego -run 'TestSameOutput|TestRandomAgainstGeth' .
      - name: secp256k1 differential (libsecp256k1 via cgo, decred v4)
        run: go test -count=1 -run 'Secp256k1' -v . | grep -E '^(ok|FAIL|---)'
      - name: secp256k1 parity (addresses, raw recovery, value rules, transaction values, hedged nonces)
        run: go test -count=1 -run 'Parity' -v . | grep -E '^(ok|FAIL|---)|parity_test'
      # Performance is measured on dedicated hardware with run.sh, not on
      # shared CI runners whose timings are not comparable.
