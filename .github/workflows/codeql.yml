# SPDX-License-Identifier: Apache-2.0
# GitHub-operated static analysis. Does not replace an independent human audit.
name: GitHub CodeQL security scan

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout SILA
        uses: actions/checkout@v4
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Go packages and tests for analysis
        if: matrix.language == 'go'
        # CodeQL's manual Go extraction is driven by "go build" (traced through
        # the CodeQL go wrapper); "go test" alone extracts nothing and the
        # database ends with "could not process any code written in Go".
        run: |
          go build ./...
          go build -tags purego ./...
          go test -run '^$' ./...
          go test -tags purego -run '^$' ./...
          (cd benchmarks/geth-compare && go test -run '^$' ./...)
      - name: Analyze and upload security results
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
